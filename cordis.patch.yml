# dsh-mac-pet bundle patch: inserts the host-only plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add dsh-mac-pet`.
#
# The row is a bare plugin by package name: the node half (exports ".") tracks
# agent activity and serves /api/dsh-pet/status plus the session-open queue.
# The package also declares a tiny browser half (exports "./client") that only
# forwards a queued Session id to uiWorkspace.openSession; it renders no UI and
# needs no settings namespace.
- insert:
    - id: dsh-pet
      name: 'dsh-mac-pet'
