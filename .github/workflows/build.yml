name: Build plugin and app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test bridge and installer
        run: node --test tests/*.test.mjs
      - name: Check generated artifacts
        run: git diff --exit-code -- lib

  app:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Swift app
        run: swift build -c release
      - name: Test Swift app
        run: swift test
      - name: Check shell scripts
        run: bash -n make-app.sh install.sh uninstall.sh run.sh
